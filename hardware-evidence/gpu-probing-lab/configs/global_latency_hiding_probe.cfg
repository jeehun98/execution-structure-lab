# Global Latency Hiding Probe
#
# active_warps_values:
#   하나의 block 안에서 global memory load를 수행하는 warp 수 목록.
#   1, 2, 4, 8, 16 순서로 latency hiding scaling을 관찰한다.
#
# blocks:
#   실행할 block 수.
#   blocks=1이면 하나의 block 내부 warp 수 변화에 집중한다.
#
# cycle_budget:
#   각 warp가 clock64 기준으로 반복 실행할 cycle budget.
#
# sample_period:
#   progress 중간 기록 주기.
#
# global_elements:
#   global memory working set 크기.
#   너무 작으면 cache 효과가 강해지고, 너무 크면 DRAM latency 성격이 더 잘 드러난다.

active_warps_values=1,2,4,8,16,32
blocks=1
cycle_budget=200000000
sample_period=256
global_elements=16777216