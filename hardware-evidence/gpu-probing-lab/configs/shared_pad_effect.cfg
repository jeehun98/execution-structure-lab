# Shared Padding Effect Probe
# Compare padded shared-memory stride response against baseline shared stride sweep.

probe_id=shared-pad-effect
output_raw=results/raw/shared_pad_effect.json

num_blocks=256
threads_per_block=256
accesses_per_thread=1024

# Shared span is the logical span before padding.
# The physical allocation becomes shared_span_floats + shared_span_floats / padding_period + safety.
shared_span_floats=8192

padding_period=32
inner_iters=1
warmup_iters=5
repeat_iters=30

strides=1,2,3,5,7,9,11,13,15,16,17,19,23,29,31,32,33,37,41,47,48,49,53,59,61,63,64,65,71,79,83,97