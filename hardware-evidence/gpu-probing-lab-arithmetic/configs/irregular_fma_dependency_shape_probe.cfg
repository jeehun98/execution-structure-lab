# Irregular FMA Dependency Shape Probe
# Compares dependent and independent FFMA instruction streams
# with matched instruction counts and intentionally irregular chain lengths.

probe_name=irregular_fma_dependency_shape_probe
description=Compares dependent and independent FFMA chains using irregular instruction counts 3, 7, 13, and 29.
output_path=results/raw/irregular_fma_dependency_shape_probe.json

blocks=1
threads_per_block=256
warps_per_block=8

repeat=10

use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

# role_0 = dependent_fma_chain_3
# role_1 = independent_fma_3
# role_2 = dependent_fma_chain_7
# role_3 = independent_fma_7
# role_4 = dependent_fma_chain_13
# role_5 = independent_fma_13
# role_6 = dependent_fma_chain_29
# role_7 = independent_fma_29

write_sink=1