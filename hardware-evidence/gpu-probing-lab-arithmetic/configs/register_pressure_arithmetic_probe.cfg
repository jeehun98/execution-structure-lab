# Planned probe.
# Increases live accumulator count and observes when ILP benefits are offset by register pressure.

probe_name=register_pressure_arithmetic_probe
output_path=results/raw/register_pressure_arithmetic_probe.json

blocks=1
threads_per_block=128
warps_per_block=4

repeat=10
use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

role_0=live_values_4
role_1=live_values_8
role_2=live_values_16
role_3=live_values_32

write_sink=1