# Arithmetic Dependency Probe
# Compares independent arithmetic workloads and dependent arithmetic chains.

probe_name=arithmetic_dependency_probe
output_path=results/raw/arithmetic_dependency_probe.json

blocks=1
threads_per_block=128
warps_per_block=4

repeat=10

# If use_clock_budget=1, each warp runs until clock_budget_cycles is reached.
# If use_clock_budget=0, each warp runs fixed iterations.
use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

role_0=independent_fma
role_1=dependent_fma_chain
role_2=independent_add
role_3=dependent_add_chain

write_sink=1