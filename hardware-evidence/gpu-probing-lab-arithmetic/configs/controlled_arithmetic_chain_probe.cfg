# Controlled Arithmetic Chain Probe
# Attempts to create strict single-accumulator dependent ADD and FMA chains
# using inline PTX.

probe_name=controlled_arithmetic_chain_probe
description=Attempts to compare strict dependent ADD and FMA chains with fixed source operands and inline PTX.
output_path=results/raw/controlled_arithmetic_chain_probe.json

blocks=1
threads_per_block=128
warps_per_block=4

repeat=10

use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

# role_0: controlled_dependent_add_8
# role_1: controlled_dependent_fma_8
# role_2: controlled_dependent_add_16
# role_3: controlled_dependent_fma_16

write_sink=1