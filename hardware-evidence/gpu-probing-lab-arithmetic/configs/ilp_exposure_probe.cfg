# Planned probe.
# Varies the number of independent accumulator lanes.

probe_name=ilp_exposure_probe
output_path=results/raw/ilp_exposure_probe.json

blocks=1
threads_per_block=128
warps_per_block=4

repeat=10
use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

role_0=accumulator_1
role_1=accumulator_2
role_2=accumulator_4
role_3=accumulator_8

write_sink=1