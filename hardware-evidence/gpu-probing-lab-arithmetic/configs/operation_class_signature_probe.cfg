# Planned probe.
# Compares ADD, MUL, FMA, DIV, SQRT, and SFU-like operation signatures.

probe_name=operation_class_signature_probe
output_path=results/raw/operation_class_signature_probe.json

blocks=1
threads_per_block=128
warps_per_block=4

repeat=10
use_clock_budget=1
clock_budget_cycles=10000000
iterations=100000

role_0=fp32_add
role_1=fp32_mul
role_2=fp32_fma
role_3=fp32_div

write_sink=1